<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rescue Drone</title>
<style>
  :root { color-scheme: dark; --bg: #0b0f14; --panel: #121821; --line: #223042; --text: #e6edf3; --muted: #8b9bb0; --good: #3fb950; --warn: #f29e4c; --bad: #e5534b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.35 -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  body { max-width: 640px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .status { padding: 14px 16px; border-radius: 10px; background: var(--panel); border-left: 6px solid var(--line); }
  .status.good { border-color: var(--good); } .status.warn { border-color: var(--warn); } .status.bad { border-color: var(--bad); }
  .status h1 { margin: 0; font-size: 24px; font-weight: 700; }
  .status p { margin: 2px 0 0; color: var(--muted); }
  .map { margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  #map { display: block; width: 100%; height: auto; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .fact { padding: 8px 10px; border-radius: 8px; background: var(--panel); }
  .fact b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .fact span { color: var(--muted); font-size: 13px; }
  button { width: 100%; min-height: 48px; margin: 12px 0; border: 1px solid var(--line); border-radius: 8px; background: #1a2330; color: var(--text); font: inherit; font-weight: 600; }
  button.on { border-color: var(--warn); background: #33240f; }
  .note { margin: 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="status" id="status" role="status"><h1 id="headline">Connecting</h1><p id="detail"></p></div>
<div class="map"><canvas id="map" width="880" height="600" aria-label="This drone's view of the map"></canvas></div>
<div class="facts">
  <div class="fact"><b id="drone">–</b><span>Your drone</span></div>
  <div class="fact"><b id="searched">0%</b><span>Map it knows</span></div>
  <div class="fact"><b id="found">0</b><span>People it knows of</span></div>
</div>
<button id="radio" hidden>Radio off</button>
<p class="note">Keep this page open with the screen on. Flight, sensors and the missing people are simulated on this phone. The network and any outage are real.</p>
<script type="module" src="phone.js"></script>
</body>
</html>
